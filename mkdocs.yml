site_name: ГИСОГД — руководство пользователя
site_description: Иллюстрированное руководство пользователя платформы ГИСОГД
site_author: Поляков Дмитрий
site_url: https://gisogd-user-guide.polakov1245.workers.dev/
docs_dir: docs
site_dir: _site
strict: true

theme:
  name: material
  language: ru
  logo: assets/images/brand/lightning.png
  favicon: assets/images/brand/lightning-favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему

plugins:
  - search:
      lang: ru

hooks:
  - hooks/readability.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/home.css
  - assets/stylesheets/viewer.css

extra_javascript:
  - assets/javascripts/lightbox.js

extra:
  generator: false

copyright: © 2026 Поляков Дмитрий

nav:
