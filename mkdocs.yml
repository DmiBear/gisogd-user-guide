site_name: ГИСОГД — руководство пользователя
site_description: Иллюстрированное руководство пользователя платформы ГИСОГД
site_author: Поляков Дмитрий
site_url: https://gisogd-user-guide.polakov1245.workers.dev/
docs_dir: docs
site_dir: _site
strict: true

theme:
  name: material
  language: ru
  logo: assets/images/brand/lightning.png
  favicon: assets/images/brand/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/lightbox.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DmiBear
      name: Профиль Дмитрия Полякова на GitHub

copyright: © 2026 Поляков Дмитрий

nav:
  - Главная: index.md
  - Начало работы:
      - Введение: introduction.md
      - Назначение и условия применения: purpose.md
      - Подготовка к работе: getting-started.md
  - Основные операции:
      - Обзор: operations/index.md
      - Навигация и табличные формы: operations/navigation-and-tables.md
      - Записи и карточки: operations/records.md
      - Работа с картой: operations/map.md
  - Состав ГИСОГД:
      - Обзор: gisogd/index.md
      - Разделы и документы: gisogd/overview.md
      - Регистрация заявок: gisogd/requests.md
      - Размещение документа: gisogd/document-placement.md
      - Реестры документов:
          - Разделы 1–6: gisogd/registries/sections-1-6.md
          - Разделы 7–12: gisogd/registries/sections-7-12.md
          - Раздел 13:
              - Обзор: gisogd/registries/section-13/index.md
              - Земельные участки и объекты: gisogd/registries/section-13/land-and-construction.md
              - Разрешения: gisogd/registries/section-13/permits.md
              - Уведомления: gisogd/registries/section-13/notifications.md
              - Сервитуты и технические условия: gisogd/registries/section-13/additional.md
          - Разделы 14–18: gisogd/registries/sections-14-18.md
  - Программа обучения:
      - Обзор программы: training/index.md
      - Вебинары 1–5: training/webinars-1-5.md
      - Вебинары 6–10: training/webinars-6-10.md
      - Практические работы: training/practice.md
      - Контроль и рекомендации: training/assessment.md
  - Видеоинструкции: videos/index.md
  - О руководстве: about.md
